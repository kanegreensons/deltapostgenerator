function stopSegmentSound(){slotSound.pause();slotSound.currentTime=0;}

function playWinSound(){winSound.pause();winSound.currentTime=0;winSound.play().catch(()=>{});}
const h=86;

let startBag=[], endBag=[], previousStart=-1, previousEnd=-1;
function refillBag(size, previous){
  const bag=Array.from({length:size},(_,i)=>i);
  for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}
  if(bag.length>1 && bag[0]===previous){const swap=1+Math.floor(Math.random()*(bag.length-1));[bag[0],bag[swap]]=[bag[swap],bag[0]];}

  if(bag.length>1 && bag[bag.length-1]===previous){[bag[0],bag[bag.length-1]]=[bag[bag.length-1],bag[0]];}
  return bag;
}
function drawStart(){
  if(!startBag.length)startBag=refillBag(starts.length,previousStart);
  previousStart=startBag.pop();return starts[previousStart];
}
function drawEnd(){
  if(!endBag.length)endBag=refillBag(ends.length,previousEnd);
  previousEnd=endBag.pop();return ends[previousEnd];
}
function randomText(){
  const a=drawStart();
  if(a==='The truth is that B is B')return 'The truth is that '+drawEnd()+' is '+drawEnd()+'.';
  if(a==='I am not B, I am actually B')return 'I am not '+drawEnd()+', I am actually '+drawEnd()+'.';
  if(a==='I fucking HATE')return a+' '+drawEnd().toUpperCase()+'.';
  return a+' '+drawEnd()+'.';
}

function winningResults(){
  const used=new Set();
  const results=[];
  for(let i=0;i<SLOT_COUNT;i++){
    let key, text;
    do {
      const ai=Math.floor(Math.random()*starts.length);
      const bi=Math.floor(Math.random()*ends.length);
      const a=starts[ai], b=ends[bi];
      if(a==='The truth is that B is B'||a==='I am not B, I am actually B'){
        let second;
        do{second=Math.floor(Math.random()*ends.length);}while(second===bi);
        key=ai+':'+bi+':'+second;
        text=a==='The truth is that B is B'
          ? 'The truth is that '+b+' is '+ends[second]+'.'
          : 'I am not '+b+', I am actually '+ends[second]+'.';
      }else{
        key=ai+':'+bi;
        text=a==='I fucking HATE' ? a+' '+b.toUpperCase()+'.' : a+' '+b+'.';
      }

  }
  return results;
}
function setup(){startBag=[];endBag=[];previousStart=-1;previousEnd=-1;lockSound.pause();winSound.pause();lockSound.currentTime=0;winSound.currentTime=0;target.replaceChildren();for(let i=0;i<SLOT_COUNT;i++){let outer=document.createElement('span');outer.className='slot-line';let reel=document.createElement('span');reel.className='slot-reel';let cell=document.createElement('span');cell.className='slot-cell';cell.textContent=i===0?'': ' ';reel.append(cell);outer.append(reel);target.append(outer);}}
function spin(outer,finalText){return new Promise(resolve=>{
  const reel=outer.firstElementChild;
  outer.classList.add('spinning');
  reel.replaceChildren();

  const count=220, trailing=18;
  for(let j=0;j<=count+trailing;j++){
    const cell=document.createElement('span');
    cell.className='slot-cell';
    if(j===count){cell.textContent=finalText;}else{let candidate=randomText();let tries=0;while(j>0 && candidate===reel.lastElementChild?.textContent && tries++<12)candidate=randomText();cell.textContent=candidate;}
    reel.append(cell);
  }
  let finished=false, raf=0;
  const DURATION_MS=3240;

  const BRAKE_START_MS=1440;
  const BRAKE_DURATION_MS=DURATION_MS-BRAKE_START_MS;
  const totalY=count*h;

  const initialVelocity=totalY/(BRAKE_START_MS+BRAKE_DURATION_MS/4);
  const brakeStartY=initialVelocity*BRAKE_START_MS;
  const start=performance.now();
  function lock(){
    if(finished)return;
    finished=true;
    cancelAnimationFrame(raf);

    reel.style.transform=`translate3d(0,${-totalY}px,0)`;
    const winningCell=reel.children[count];
    reel.replaceChildren(winningCell);
    reel.style.transform='translate3d(0,0,0)';
    outer.classList.remove('spinning');
    outer.classList.add('locked');
    stopSegmentSound();
    playLockSound();
    setTimeout(resolve,1200);
  }
  slotSound.pause();
  slotSound.currentTime=0;
  slotSound.play().catch(()=>{});
  function frame(now){
    if(finished)return;
    const elapsed=Math.min(DURATION_MS,now-start);
    let y;
    if(elapsed<=BRAKE_START_MS){
      y=initialVelocity*elapsed;
    }else{
      const brakeElapsed=elapsed-BRAKE_START_MS;
      const u=Math.min(1,brakeElapsed/BRAKE_DURATION_MS);
      y=brakeStartY+initialVelocity*(BRAKE_DURATION_MS/4)*(1-Math.pow(1-u,4));
    }
    reel.style.transform=`translate3d(0,${-y}px,0)`;
    if(elapsed>=DURATION_MS){lock();return;}
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
});}
async function run(){if(running)return;running=true;setup();const slots=[...target.children];const results=winningResults();for(let i=0;i<slots.length;i++){await spin(slots[i],results[i]);}playWinSound();celebrate();running=false;}

function celebrate(){
  confettiSound.pause(); confettiSound.currentTime=0; confettiSound.play().catch(()=>{});
  cancelAnimationFrame(confettiFrame);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  confettiCanvas.width=Math.round(innerWidth*dpr);
  confettiCanvas.height=Math.round(innerHeight*dpr);
  confettiCtx.setTransform(dpr,0,0,dpr,0,0);
  const tweetBounds=document.querySelector('.tweet').getBoundingClientRect();

  const cannonLeft=tweetBounds.left-tweetBounds.width*.025;
  const cannonRight=tweetBounds.right+tweetBounds.width*.025;
  const cannonY=tweetBounds.bottom+tweetBounds.width*.025;
  const scale=Math.max(.4,Math.min(1.5,tweetBounds.width/1080));
  const palette=['#ffcf39','#ff4b8d','#62e3ff','#9dff87','#c69bff','#ffffff','#ff7e48'];
  const start=performance.now();
  let previous=start;

  confettiPieces=Array.from({length:({low:300,med:1000,high:2400}[confettiAmount])},(_,i)=>{
    const left=i%2===0;
    const spread=(Math.random()-.5)*1.85;
    const direction=left ? 1 : -1;
    const speed=540+Math.random()*340;

    const angle=Math.max(.24,Math.min(1.43,(Math.PI/3.35)+spread*.53));
    return {
      x:(left ? cannonLeft : cannonRight)+(Math.random()-.5)*10*scale,
      y:cannonY+(Math.random()-.5)*8*scale,
      vx:direction*Math.cos(angle)*speed*scale,
      vy:-Math.sin(angle)*speed*scale,
      gravity:(230+Math.random()*115)*scale,
      drag:0.985+Math.random()*.008,
      size:4+Math.random()*8,
      angle:Math.random()*Math.PI*2,
      spin:(Math.random()-.5)*7,
      wobble:Math.random()*Math.PI*2,
      color:palette[Math.floor(Math.random()*palette.length)]
    };
  });
  confettiUntil=start+10500;
  function draw(now){
    const dt=Math.min((now-previous)/1000,.045);previous=now;
    confettiCtx.clearRect(0,0,innerWidth,innerHeight);
    for(const c of confettiPieces){

      c.vx*=Math.pow(c.drag,dt*60);
      c.vy+=c.gravity*dt;
      if(c.vy>95)c.vy=95;
      c.x+=(c.vx+Math.sin(now*.002+c.wobble)*24)*dt;
      c.y+=c.vy*dt;
      c.angle+=c.spin*dt;
      if(c.y>tweetBounds.bottom+30*scale)continue;
      confettiCtx.save();confettiCtx.translate(c.x,c.y);
      confettiCtx.rotate(c.angle);
      confettiCtx.fillStyle=c.color;
      confettiCtx.fillRect(-c.size*scale/2,-c.size*scale/3,c.size*scale,c.size*scale*.65);
      confettiCtx.restore();
    }
    if(now<confettiUntil)confettiFrame=requestAnimationFrame(draw);
    else {confettiPieces=[];confettiCtx.clearRect(0,0,innerWidth,innerHeight);}
  }
  confettiFrame=requestAnimationFrame(draw);

confettiSound.preload='auto';
const exportButton=document.getElementById('exportMp4');
let audioContext,recordingAudioDestination;
function ensureAudioGraph(){
  if(recordingAudioDestination)return;
  audioContext=new (window.AudioContext||window.webkitAudioContext)();
  recordingAudioDestination=audioContext.createMediaStreamDestination();
  for(const element of [slotSound,lockSound,winSound,confettiSound]){
    const source=audioContext.createMediaElementSource(element);
    source.connect(audioContext.destination);
    source.connect(recordingAudioDestination);
  }
}
function waitForAudio(audio,maximum=12000){
  return new Promise(resolve=>{
    if(audio.ended||audio.error){resolve();return;}
    const done=()=>{clearTimeout(timeout);audio.removeEventListener('ended',done);resolve();};
    const timeout=setTimeout(done,maximum);
    audio.addEventListener('ended',done,{once:true});
  });
}
async function exportAnimation(){
  if(running)return;
  if(!navigator.mediaDevices?.getDisplayMedia||!window.MediaRecorder){
    alert('This browser doesnt support video recording.');return;
  }
  exportButton.disabled=true;

  document.body.classList.add('recording');

  let displayStream,recorder,video,canvasStream,drawId;
  try{

    displayStream=await navigator.mediaDevices.getDisplayMedia({
      video:{frameRate:60},audio:false,preferCurrentTab:true,selfBrowserSurface:'include'
    });
    if(!displayStream.getVideoTracks().length)throw Error('no tab video selected.');
    video=document.createElement('video');
    video.srcObject=displayStream;video.muted=true;video.playsInline=true;
    await video.play();
    if(!video.videoWidth)await new Promise((resolve,reject)=>{
      const timeout=setTimeout(()=>reject(Error('tab video.')),5000);
      video.addEventListener('loadedmetadata',()=>{clearTimeout(timeout);resolve();},{once:true});
    });

    const tweet=document.querySelector('.tweet');
    const pageRect=tweet.getBoundingClientRect();
    const sx=video.videoWidth/innerWidth;
    const sy=video.videoHeight/innerHeight;
    if(pageRect.left<0||pageRect.top<0||pageRect.right>innerWidth+1||pageRect.bottom>innerHeight+1){
      throw Error('The tweet doesnt fit in the tab stupid');
    }
    const output=document.createElement('canvas');
    output.width=1660;
    output.height=Math.round(output.width*pageRect.height/pageRect.width);
    const ctx=output.getContext('2d',{alpha:false});
    const crop={x:pageRect.left*sx,y:pageRect.top*sy,w:pageRect.width*sx,h:pageRect.height*sy};
    function draw(){
      ctx.fillStyle='#000';ctx.fillRect(0,0,output.width,output.height);
      if(video.readyState>=2)ctx.drawImage(video,crop.x,crop.y,crop.w,crop.h,0,0,output.width,output.height);
      drawId=requestAnimationFrame(draw);
    }
    ensureAudioGraph();
    await audioContext.resume();

    await new Promise(r=>setTimeout(r,700));
    draw();
    canvasStream=output.captureStream(60);
    const combined=new MediaStream([
      ...canvasStream.getVideoTracks(),
      ...recordingAudioDestination.stream.getAudioTracks()
    ]);

    const candidates=[
      'video/webm;codecs=vp8,opus',
      'video/webm;codecs=vp9,opus',
      'video/webm'
    ];
    recorder=null;let mimeType=null;
    for(const type of candidates){
      if(!MediaRecorder.isTypeSupported(type))continue;
      try{
        const trial=new MediaRecorder(combined,{
          mimeType:type,videoBitsPerSecond:4500000,audioBitsPerSecond:128000
        });
        trial.start();
        trial.stop();
        recorder=new MediaRecorder(combined,{
          mimeType:type,videoBitsPerSecond:4500000,audioBitsPerSecond:128000
        });
        mimeType=type;
        break;
      }catch{}
    }
    if(!recorder)throw Error('no usable webm recorder was found.');

    const chunks=[];

    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
    const finished=new Promise((resolve,reject)=>{
      recorder.onstop=resolve;recorder.onerror=e=>reject(e.error||Error('recording failed.'));
    });
    recorder.start(250);
    await new Promise(r=>setTimeout(r,250));
    await run();
    await waitForAudio(winSound);

    recorder.stop();
    await finished;
    const blob=new Blob(chunks,{type:mimeType});
    if(!blob.size)throw Error('the recording was empty.');
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='tobyfox-slot-machine-cropped.webm';
    document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);

  }catch(err){
    alert('Export could not finish: '+(err?.message||err));
  }finally{
    if(recorder?.state==='recording')recorder.stop();
    if(drawId!==undefined)cancelAnimationFrame(drawId);
    canvasStream?.getTracks().forEach(t=>t.stop());
    displayStream?.getTracks().forEach(t=>t.stop());
    if(video){video.pause();video.srcObject=null;}
    document.body.classList.remove('recording');

    exportButton.disabled=false;
  }
}
exportButton.addEventListener('click',exportAnimation);
setup();
